# Vanilla GRPO on Full condition with BINARY outcome.
# Expected: weak signal (only 9/90 task groups have outcome variance), used as
# the spec-aligned weak baseline for SeRPO comparison.

model_name: Qwen/Qwen2.5-7B-Instruct
parquet_path: grpo/data/round0/vanilla_full_binary.parquet
output_dir: grpo/ckpts/vanilla_full_binary/round1

K_steps: 20
mini_batch_size: 8
micro_batch_size: 1
lr: 1.0e-6
clip_eps: 0.2
kl_beta: 0.01
grad_clip: 1.0

lora_rank: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

seed: 42
log_every: 1
gradient_checkpointing: true
