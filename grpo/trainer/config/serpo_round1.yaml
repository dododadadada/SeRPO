# SeRPO Round-1 training config (Fail-Only condition).
# Trainer code: grpo/trainer/offline_trainer.py
# Spec: docs/superpowers/specs/2026-05-13-grpo-v1-claim-design.md

model_name: Qwen/Qwen2.5-7B-Instruct
parquet_path: grpo/data/round0/serpo_failonly.parquet
output_dir: grpo/ckpts/serpo/round1

K_steps: 20
mini_batch_size: 8
micro_batch_size: 1
lr: 1.0e-6
clip_eps: 0.2
kl_beta: 0.01
grad_clip: 1.0

lora_rank: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

seed: 42
log_every: 1
gradient_checkpointing: true
