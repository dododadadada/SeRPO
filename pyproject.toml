[project]
name = "grpo"
version = "0.1.0"
description = "Offline GRPO trainer for SeRPO research on AppWorld + Qwen2.5-7B"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.10",
    "transformers>=4.57",
    "verl>=0.5",
    "peft>=0.13",
    "datasets>=2.20",
    "pyarrow>=15.0",
    "accelerate>=0.34",
    "PyYAML>=6.0",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["grpo*"]
exclude = ["grpo.data*", "grpo.ckpts*", "grpo.metrics*", "grpo.tests.fixtures*"]

[tool.pytest.ini_options]
markers = [
    "gpu: tests that require a GPU (skipped by default; run with -m gpu)",
]
addopts = "-m 'not gpu'"
testpaths = ["grpo/tests"]
